    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBg: '#FAF8F2',
                        brandBgSecondary: '#F1EDE3',
                        brandText: '#20251F',
                        brandTextSecondary: '#6B7068',
                        brandAccent: '#71845B',
                        brandDark: '#20251F',
                        brandBorder: '#E5E0D5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }

    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- React Router CDN -->
    <script src="https://unpkg.com/@remix-run/router@1.15.1/dist/router.umd.min.js"></script>

    <!-- Lucide Icons CDN -->

    <style>
        body {
            background-color: #FAF8F2;
            color: #20251F;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

            },

                category: "Logistics",

            },
            {
                id: "it-software-eu",

            },
            {

            },

                category: "Manufacturing",

            }
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // Scroll to Top on route change
        const ScrollToTop = () => {
            const { pathname } = useLocation();
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [pathname]);
            return null;
        };

        // Booking Modal
        const BookingModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
                    <div className="bg-[#FAF8F2] border border-[#E5E0D5] rounded-2xl max-w-lg w-full p-6 md:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                        <button 
                            onClick={onClose}
                            className="absolute top-4 right-4 text-[#6B7068] hover:text-[#20251F] p-2 rounded-full hover:bg-[#F1EDE3] transition-colors"
                        >
                            <Icon name="x" className="w-5 h-5" />
                        </button>

                            <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[#71845B]/10 text-[#71845B] mb-3">
                                <Icon name="calendar" className="w-6 h-6" />
                            </div>
                            <h3 className="text-2xl font-serif text-[#20251F] font-bold">Schedule Your Strategy Call</h3>
                            <p className="text-sm text-[#6B7068] mt-2">

                            </p>
                        </div>

                            <div className="flex items-start space-x-3 text-left">
                                <Icon name="check-circle" className="w-5 h-5 text-[#71845B] shrink-0 mt-0.5" />
                                <div>
                                    <h4 className="text-sm font-semibold text-[#20251F]">30-Minute Discovery Session</h4>
                                    <p className="text-xs text-[#6B7068]">We review your Ideal Customer Profile and current sales bottlenecks.</p>
                                </div>
                            </div>
                            <div className="flex items-start space-x-3 text-left">
                                <Icon name="check-circle" className="w-5 h-5 text-[#71845B] shrink-0 mt-0.5" />
                                <div>
                                    <h4 className="text-sm font-semibold text-[#20251F]">Actionable Growth Roadmap</h4>
                                    <p className="text-xs text-[#6B7068]">Get clear insights into decision-maker research & outreach potential.</p>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            <a
                                href={SITE_CONFIG.social.whatsapp}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="w-full py-3.5 px-4 bg-[#20251F] text-white rounded-xl font-medium hover:bg-[#333a32] transition-colors flex items-center justify-center space-x-2"
                            >
                                <Icon name="message-square" className="w-4 h-4 text-[#71845B]" />
                                <span>Instant Booking via WhatsApp</span>
                            </a>
                            <Link
                                to="/contact"
                                onClick={onClose}
                                className="w-full py-3.5 px-4 bg-white border border-[#E5E0D5] text-[#20251F] rounded-xl font-medium hover:bg-[#F1EDE3] transition-colors flex items-center justify-center space-x-2 text-center"

                                <Icon name="mail" className="w-4 h-4 text-[#6B7068]" />

                            </Link>

                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);

            ];

                }`}>

                                    </span>
                                    <span className="text-[10px] uppercase tracking-widest text-[#6B7068] font-semibold -mt-1">
                                        B2B Lead Generation
                                    </span>
                                </div>
                            </Link>

                                    return (
                                        <Link
                                            key={link.path}
                                            to={link.path}
                                            className={`text-sm font-medium transition-colors relative py-1 ${
                                                isActive ? "text-[#20251F] font-semibold" : "text-[#6B7068] hover:text-[#20251F]"
                                            }`}
                                        >
                                            {link.name}
                                            {isActive && (
                                                <span className="absolute bottom-0 left-0 w-full h-0.5 bg-[#71845B] rounded-full" />
                                            )}
                                        </Link>
                                    );
                                })}

                            <div className="hidden md:flex items-center space-x-4">

                                    <span>Book a Consultation</span>

                                                ? "bg-[#F1EDE3] text-[#20251F] font-semibold border-l-4 border-[#71845B]"

                                    onClick={() => {
                                        setMobileMenuOpen(false);
                                        onOpenBooking();
                                    }}
                                    className="w-full py-3 px-4 rounded-xl bg-[#20251F] text-white text-center font-medium hover:bg-[#71845B] transition-colors shadow-sm flex items-center justify-center space-x-2"

                                    Z
                                </div>
                                <span className="font-serif text-2xl font-bold tracking-tight text-white">

                        <div className="space-y-3">

                                <li><Link to="/team" className="hover:text-white transition-colors">Team & Strategy</Link></li>

                            </ul>
                        </div>

                        <div className="space-y-3">
                            <h4 className="text-sm font-semibold uppercase tracking-wider text-[#71845B]">Services</h4>

                                    </a>
                                </p>
                            </div>

                <section className="pt-8 md:pt-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                        <div className="lg:col-span-7 space-y-6">

                            <p className="text-base sm:text-lg text-[#6B7068] leading-relaxed max-w-2xl">

                            </p>

                            <div className="pt-2 flex flex-col sm:flex-row items-stretch sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                                <Link
                                    to="/services"
                                    className="py-3.5 px-6 rounded-xl bg-[#20251F] text-white font-medium hover:bg-[#71845B] transition-colors shadow-sm text-center flex items-center justify-center space-x-2"
                                >
                                    <span>Explore Our Services</span>
                                    <Icon name="arrow-right" className="w-4 h-4" />
                                </Link>
                                <button
                                    onClick={onOpenBooking}
                                    className="py-3.5 px-6 rounded-xl bg-white border border-[#E5E0D5] text-[#20251F] font-medium hover:bg-[#F1EDE3] transition-colors text-center"
                                >
                                    Let's Talk Strategy
                                </button>
                            </div>
                        </div>

                        <div className="lg:col-span-5">
                            <div className="relative rounded-2xl bg-white p-6 sm:p-8 border border-[#E5E0D5] shadow-xl space-y-6">
                                <div className="flex items-center justify-between pb-4 border-b border-[#E5E0D5]">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-10 h-10 rounded-xl bg-[#FAF8F2] flex items-center justify-center text-[#71845B]">
                                            <Icon name="bar-chart-3" className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-semibold text-[#20251F]">Sales Development Engine</h3>
                                            <p className="text-xs text-[#6B7068]">Active Campaign Monitoring</p>
                                        </div>
                                    </div>
                                    <span className="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold border border-emerald-200">
                                        Live Outreach
                                    </span>
                                </div>

                                <div className="space-y-3">
                                    <div className="bg-[#FAF8F2] p-3.5 rounded-xl border border-[#E5E0D5] flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-[#20251F]">Targeted Prospect Research</p>
                                            <p className="text-[11px] text-[#6B7068]">1,250 Verified Contacts</p>
                                        </div>
                                        <span className="text-xs font-bold text-[#71845B]">100% Verified</span>
                                    </div>
                                    <div className="bg-[#FAF8F2] p-3.5 rounded-xl border border-[#E5E0D5] flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-[#20251F]">Personalized Outreach</p>
                                            <p className="text-[11px] text-[#6B7068]">Warm Email & LinkedIn</p>
                                        </div>
                                        <span className="text-xs font-bold text-[#20251F]">Active Sequence</span>
                                    </div>
                                    <div className="bg-[#20251F] text-white p-4 rounded-xl shadow-md flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-semibold text-white">Qualified Meetings</p>
                                            <p className="text-[11px] text-gray-300">Ready for Account Execs</p>
                                        </div>
                                        <span className="text-xs font-bold text-[#71845B] bg-white/10 px-2 py-1 rounded">High Intent</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                {/* Services Preview */}
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                    <div className="flex flex-col md:flex-row md:items-end justify-between">
                        <div>
                            <h2 className="text-xs font-semibold uppercase tracking-widest text-[#71845B]">Services Overview</h2>
                            <p className="text-3xl font-serif text-[#20251F] font-bold mt-1">Specialized Lead Generation Capabilities</p>
                        </div>
                        <Link to="/services" className="text-sm font-semibold text-[#71845B] hover:underline mt-2 md:mt-0">View All Services ?</Link>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {SERVICES_DATA.slice(0, 6).map((srv) => (
                            <div key={srv.id} className="bg-white p-6 rounded-2xl border border-[#E5E0D5] space-y-3 flex flex-col justify-between">
                                <div>
                                    <h3 className="text-lg font-serif font-bold text-[#20251F]">{srv.title}</h3>
                                    <p className="text-xs text-[#6B7068] mt-2 leading-relaxed">{srv.shortDesc}</p>
                                </div>
                                <Link to="/services" className="text-xs font-semibold text-[#71845B] hover:underline pt-2 inline-block">Explore Details ?</Link>
                            </div>
                        ))}
                    </div>
                </section>
            </div>
        );

       
 // Team Page
 const TeamPage = ({ onOpenBooking }) => (
     <div className="space-y-16 pb-16 pt-8">
         <section className="max-w-7xl mx-auto px-4 text-center space-y-4">
             <span className="text-xs font-semibold uppercase tracking-widest text-[#71845B]">
                 Leadership & Mindset
             </span>
             <h1 className="text-3xl sm:text-5xl font-serif font-bold text-[#20251F]">
                 The People Behind Your Growth
             </h1>
             <p className="text-base text-[#6B7068] max-w-2xl mx-auto">
                 Meet the team helping businesses discover opportunities and build stronger B2B relationships.
             </p>
         </section>

         <section className="max-w-4xl mx-auto px-4">
             <div className="bg-white border border-[#E5E0D5] rounded-3xl p-8 shadow-sm grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                 <div className="md:col-span-4 text-center space-y-3">
                     <div className="w-36 h-36 rounded-2xl overflow-hidden mx-auto">
                         <img
                             src="1.png"
                             alt="Muhammad Zulqarnain - Founder of Zyphora Growth"
                             className="w-full h-full object-cover"
                         />
                     </div>
                     <div>
                         <h3 className="text-lg font-bold text-[#20251F]">
                             {SITE_CONFIG.founder.name}
                         </h3>
                         <p className="text-xs text-[#71845B] font-semibold">
                             {SITE_CONFIG.founder.title}
                         </p>
                     </div>
                 </div>

                 <div className="md:col-span-8 space-y-4">
                     <h4 className="text-xs font-semibold uppercase text-[#6B7068]"></h4>
                     <p className="text-xs text-[#20251F] leading-relaxed">
                         {SITE_CONFIG.founder.bio}
                     </p>
                     <a
                         href={SITE_CONFIG.founder.linkedin}
                         target="_blank"
                         rel="noopener noreferrer"
                         className="inline-flex items-center space-x-2 text-xs font-semibold text-[#71845B] hover:underline"
                     >
                         <span>Connect on LinkedIn</span>
                         <Icon name="external-link" className="w-3.5 h-3.5" />
                     </a>
                 </div>
             </div>
         </section>
     </div>
 );


        // Services Page
        const ServicesPage = ({ onOpenBooking }) => (
            <div className="space-y-16 pb-16 pt-8">
                <section className="max-w-7xl mx-auto px-4 text-center space-y-4">
                    <span className="text-xs font-semibold uppercase tracking-widest text-[#71845B]">Capabilities</span>
                    <h1 className="text-3xl sm:text-5xl font-serif font-bold text-[#20251F]">Comprehensive B2B Solutions</h1>
                </section>

                <section className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                    {SERVICES_DATA.map((srv) => (
                        <div key={srv.id} className="bg-white border border-[#E5E0D5] rounded-2xl p-6 space-y-4">
                            <h3 className="text-xl font-serif font-bold text-[#20251F]">{srv.title}</h3>
                            <p className="text-xs text-[#6B7068]">{srv.shortDesc}</p>
                            <ul className="space-y-1.5 text-xs text-[#20251F]">
                                {srv.deliverables.map((item, idx) => (
                                    <li key={idx} className="flex items-start space-x-2">
                                        <Icon name="check" className="w-3.5 h-3.5 text-[#71845B] shrink-0 mt-0.5" />
                                        <span>{item}</span>
                                    </li>
                                ))}
                            </ul>
                            <button onClick={onOpenBooking} className="text-xs font-semibold text-[#71845B] hover:underline pt-2">
                                Inquire About {srv.title} ?
                            </button>
                        </div>
                    ))}
                </section>
            </div>
        );

        // Portfolio Page
        const PortfolioPage = ({ onOpenBooking }) => {
            const [filter, setFilter] = useState("All");
            const filtered = filter === "All" ? PORTFOLIO_PROJECTS : PORTFOLIO_PROJECTS.filter(p => p.category === filter);

            return (
                <div className="space-y-12 pb-16 pt-8 max-w-7xl mx-auto px-4">
                    <div className="text-center space-y-3">
                        <span className="text-xs font-semibold uppercase tracking-widest text-[#71845B]">Case Models</span>
                        <h1 className="text-3xl sm:text-5xl font-serif font-bold text-[#20251F]">Strategy & Growth in Action</h1>
                    </div>

                    <div className="flex justify-center flex-wrap gap-2">
                        {["All", "Healthcare", "Logistics", "IT & Software", "Consulting", "Manufacturing"].map(cat => (
                            <button
                                key={cat}
                                onClick={() => setFilter(cat)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium ${filter === cat ? "bg-[#20251F] text-white" : "bg-white border border-[#E5E0D5] text-[#6B7068]"}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {filtered.map(p => (
                            <div key={p.id} className="bg-white border border-[#E5E0D5] rounded-2xl p-6 space-y-3">
                                <span className="text-[10px] font-bold text-[#71845B] uppercase bg-[#FAF8F2] px-2.5 py-1 rounded-full border border-[#E5E0D5]">{p.industry}</span>
                                <h3 className="text-lg font-serif font-bold text-[#20251F]">{p.title}</h3>
                                <p className="text-xs text-[#6B7068]"><strong>Challenge:</strong> {p.challenge}</p>
                                <p className="text-xs text-[#20251F]"><strong>Outcome:</strong> {p.outcomes}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Contact Page
        const ContactPage = () => {
            const [submitted, setSubmitted] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="space-y-12 pb-16 pt-8 max-w-5xl mx-auto px-4">
                    <div className="text-center space-y-3">
                        <span className="text-xs font-semibold uppercase tracking-widest text-[#71845B]">Contact Us</span>
                        <h1 className="text-3xl sm:text-5xl font-serif font-bold text-[#20251F]">Let's Talk Strategy</h1>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
                        <div className="md:col-span-5 bg-white p-6 rounded-2xl border border-[#E5E0D5] space-y-4 text-xs">
                            <h3 className="text-base font-bold text-[#20251F]">Direct Channels</h3>
                            <p><strong>Email:</strong> {SITE_CONFIG.founder.email}</p>
                            <p><strong>Phone:</strong> {SITE_CONFIG.founder.formattedPhone}</p>
                            <p><strong>Founder:</strong> {SITE_CONFIG.founder.name}</p>
                        </div>

                        <div className="md:col-span-7 bg-white p-6 rounded-2xl border border-[#E5E0D5]">
                            {submitted ? (
                                <div className="text-emerald-700 text-xs font-bold p-4 bg-emerald-50 rounded-xl">
                                    Thank you! Your inquiry brief has been submitted successfully.
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <input type="text" placeholder="Full Name *" required className="w-full p-3 text-xs bg-[#FAF8F2] border border-[#E5E0D5] rounded-xl" />
                                    <input type="email" placeholder="Work Email *" required className="w-full p-3 text-xs bg-[#FAF8F2] border border-[#E5E0D5] rounded-xl" />
                                    <input type="text" placeholder="Company Name *" required className="w-full p-3 text-xs bg-[#FAF8F2] border border-[#E5E0D5] rounded-xl" />
                                    <textarea placeholder="Brief Description of Requirements *" rows="4" required className="w-full p-3 text-xs bg-[#FAF8F2] border border-[#E5E0D5] rounded-xl"></textarea>
                                    <button type="submit" className="w-full py-3 bg-[#20251F] text-white rounded-xl text-xs font-semibold hover:bg-[#71845B]">
                                        Submit Inquiry Brief
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Wrapper
        function App() {
            const [isBookingOpen, setIsBookingOpen] = useState(false);

            return (
                <Router>
                    <ScrollToTop />
                    <div className="min-h-screen bg-[#FAF8F2] text-[#20251F] flex flex-col justify-between">
                        <Navbar onOpenBooking={() => setIsBookingOpen(true)} />
                        <main className="grow">
                            <Routes>
                                <Route path="/" element={<HomePage onOpenBooking={() => setIsBookingOpen(true)} />} />
                                <Route path="/team" element={<TeamPage onOpenBooking={() => setIsBookingOpen(true)} />} />
                                <Route path="/services" element={<ServicesPage onOpenBooking={() => setIsBookingOpen(true)} />} />
                                <Route path="/portfolio" element={<PortfolioPage onOpenBooking={() => setIsBookingOpen(true)} />} />
                                <Route path="/contact" element={<ContactPage />} />
                            </Routes>
                        </main>
                        <Footer />
                        <BookingModal isOpen={isBookingOpen} onClose={() => setIsBookingOpen(false)} />
                    </div>
                </Router>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
